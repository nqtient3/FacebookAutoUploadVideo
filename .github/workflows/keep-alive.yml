name: Render Keep-Alive (Chống ngủ đông 24/7)

on:
  schedule:
    # Chạy mỗi 10 phút (Render ngủ đông sau 15 phút không hoạt động)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công kiểm tra

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          echo "Sending Keep-Alive ping to Render..."
          curl -s -f -m 30 https://facebookautouploadvideo.onrender.com/ping || echo "Failed to ping, but wake up signal was sent."
