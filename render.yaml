services:
  - type: web
    name: fb-auto-upload-video
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_ACCESS_TOKEN
        sync: false
      - key: FB_GRAPH_API_VERSION
        value: v19.0
